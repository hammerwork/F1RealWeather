[ABOUT]
NAME = F1 Real Weather
AUTHOR = Christoffer
VERSION = 1.5
DESCRIPTION = Real F1 qualifying/sprint/race conditions (2023-2026) as Pure Planner presets

[CORE]
LAZY = NONE

[WINDOW_...]
ID = main
NAME = F1 Real Weather
ICON = icon.png
FUNCTION_MAIN = windowMain
MIN_SIZE = 300, 380
SIZE = 360, 620

; Shown in the setup screen while you are in the pits
[WINDOW_...]
ID = pit
NAME = F1 Weather - Pits
ICON = icon.png
FUNCTION_MAIN = windowPit
FLAGS = SETUP_HIDDEN, NO_TITLE_BAR, NO_SCROLLBAR, NO_SCROLL_WITH_MOUSE
BACKGROUND_COLOR = SETUP
SIZE = 460, 370
PADDING = 0, 0
DEFAULT_POSITION = 40, 160
